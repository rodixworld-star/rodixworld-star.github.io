<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BLACK ARCHIVE - Dark Story Vault</title>
  
  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23e60026' d='M256 0C114.6 0 0 114.6 0 256c0 78.5 35.4 148.8 91 195.8V480c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32v-16h72v16c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32v-28.2c55.6-47 91-117.3 91-195.8 0-141.4-114.6-256-256-256zm-80 320c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48zm160 0c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48z'/></svg>" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-black: #08080a;
      --card-bg: #121216;
      --border-color: #26262e;
      --red-primary: #e60026;
      --red-hover: #ff1a3d;
      --red-glow: rgba(230, 0, 38, 0.35);
      --text-white: #ffffff;
      --text-muted: #a0a0ab;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-reader: 'Lora', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-black);
    }
    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--red-primary);
    }

    /* Header & Navigation */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.5rem;
      background-color: rgba(8, 8, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--red-primary);
      box-shadow: 0 4px 20px rgba(230, 0, 38, 0.2);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-brand i {
      color: var(--red-primary);
      filter: drop-shadow(0 0 8px var(--red-primary));
    }

    .search-bar {
      position: relative;
      width: 340px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.6rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-white);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    .search-bar .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Buttons */
    .btn {
      padding: 0.65rem 1.4rem;
      border-radius: 4px;
      border: 1px solid transparent;
      font-family: var(--font-body);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-red {
      background-color: var(--red-primary);
      color: var(--text-white);
      box-shadow: 0 0 15px var(--red-glow);
    }

    .btn-red:hover {
      background-color: var(--red-hover);
      box-shadow: 0 0 25px rgba(230, 0, 38, 0.6);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--red-primary);
      color: var(--text-white);
    }

    .btn-outline:hover {
      background: var(--red-primary);
      box-shadow: 0 0 15px var(--red-glow);
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .icon-btn:hover, .icon-btn.active {
      color: var(--red-primary);
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* Hero / Spotlight Section */
    .hero-section {
      position: relative;
      height: 380px;
      margin: 2rem 2.5rem;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 3rem;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 8, 10, 0.98), rgba(8, 8, 10, 0.3));
    }

    .hero-details {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    .tag {
      background: var(--red-primary);
      color: var(--text-white);
      padding: 3px 10px;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-details h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      margin: 12px 0;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .hero-meta {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* Categories / Genre Filter */
    .category-bar {
      display: flex;
      gap: 12px;
      padding: 0 2.5rem;
      overflow-x: auto;
      margin-bottom: 2rem;
    }

    .category-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .category-btn.active, .category-btn:hover {
      background-color: var(--red-primary);
      color: var(--text-white);
      border-color: var(--red-primary);
      box-shadow: 0 0 12px var(--red-glow);
    }

    /* Main Container & Grid */
    .main-container {
      padding: 0 2.5rem 4rem 2.5rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .section-header h2 {
      font-family: var(--font-heading);
      letter-spacing: 1px;
    }

    .sort-selector label {
      color: var(--text-muted);
      margin-right: 8px;
      font-size: 0.9rem;
    }

    .sort-selector select {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }

    .story-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      position: relative;
    }

    .story-card:hover {
      transform: translateY(-6px);
      border-color: var(--red-primary);
      box-shadow: 0 10px 25px rgba(230, 0, 38, 0.25);
    }

    .card-img-wrapper {
      position: relative;
      height: 200px;
      cursor: pointer;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .story-card:hover .card-img-wrapper img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      margin: 10px 0;
      cursor: pointer;
      line-height: 1.3;
      transition: color 0.2s ease;
    }

    .card-title:hover {
      color: var(--red-primary);
    }

    .card-snippet {
      color: var(--text-muted);
      font-size: 0.9rem;
      flex-grow: 1;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .card-actions i {
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s ease;
    }

    .card-actions i:hover {
      color: var(--red-primary);
    }

    .card-actions i.active-heart {
      color: var(--red-primary);
    }

    .card-actions i.active-bookmark {
      color: var(--text-white);
    }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .hidden {
      display: none !important;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--red-primary);
      border-radius: 6px;
      width: 90%;
      max-width: 650px;
      padding: 2.5rem;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(230, 0, 38, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .modal-header h2 {
      font-family: var(--font-heading);
      letter-spacing: 1px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: var(--red-primary);
    }

    /* Forms */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1.4rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    input, select, textarea {
      background: var(--bg-black);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 0.9rem;
      border-radius: 4px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    small {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 0.9rem;
      margin-top: 10px;
    }

    /* Reader View Overlay */
    .reader-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 850px;
      height: 90vh;
      border-radius: 6px;
      padding: 3.5rem;
      overflow-y: auto;
      position: relative;
    }

    .reader-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    #reader-article h1 {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      margin: 15px 0;
      line-height: 1.2;
    }

    #reader-article .meta-info {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    #reader-article img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    #reader-article .body-text {
      font-family: var(--font-reader);
      font-size: 1.2rem;
      line-height: 2;
      white-space: pre-wrap;
      color: #e2e2e8;
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: var(--card-bg);
      border: 1px solid var(--red-primary);
      color: var(--text-white);
      padding: 1rem 1.5rem;
      border-radius: 4px;
      box-shadow: 0 0 20px var(--red-glow);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-skull"></i>
      <span>Black Archive</span>
    </div>
    
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="Search archive, authors, tags..." />
    </div>

    <div class="nav-actions">
      <button id="bookmarks-tab-btn" class="icon-btn" title="Saved Bookmarks">
        <i class="fa-regular fa-bookmark"></i>
      </button>
      <button id="export-archive-btn" class="icon-btn" title="Export Archive (Share File)">
        <i class="fa-solid fa-download"></i>
      </button>
      <button id="import-archive-btn" class="icon-btn" title="Import Archive File">
        <i class="fa-solid fa-upload"></i>
      </button>
      <input type="file" id="import-file-input" accept=".json" style="display: none;" />
      
      <button id="open-creator-btn" class="btn btn-red">
        <i class="fa-solid fa-plus"></i> Add Story
      </button>
    </div>
  </header>

  <!-- Featured Story Hero Section -->
  <section class="hero-section" id="hero-banner"></section>

  <!-- Categories / Genres Bar -->
  <nav class="category-bar">
    <button class="category-btn active" data-category="All">All Vaults</button>
    <button class="category-btn" data-category="Horror">Horror</button>
    <button class="category-btn" data-category="Dark Fantasy">Dark Fantasy</button>
    <button class="category-btn" data-category="Thriller">Thriller</button>
    <button class="category-btn" data-category="Sci-Fi">Sci-Fi</button>
    <button class="category-btn" data-category="Mystery">Mystery</button>
  </nav>

  <!-- Main Grid Section -->
  <main class="main-container">
    <div class="section-header">
      <h2 id="section-title">Archived Chronicles</h2>
      <div class="sort-selector">
        <label for="sort-by">Sort Vault:</label>
        <select id="sort-by">
          <option value="newest">Newest First</option>
          <option value="popular">Most Liked</option>
        </select>
      </div>
    </div>

    <div id="story-grid" class="story-grid"></div>
  </main>

  <!-- Reader Modal Window -->
  <div id="reader-modal" class="modal hidden">
    <div class="reader-content">
      <div class="reader-header-bar">
        <button id="share-reader-story-btn" class="btn btn-outline">
          <i class="fa-solid fa-share-nodes"></i> Share Story
        </button>
        <button id="close-reader-btn" class="close-btn">&times;</button>
      </div>
      <article id="reader-article"></article>
    </div>
  </div>

  <!-- Story Creator Modal Window -->
  <div id="creator-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Submit to Archive</h2>
        <button id="close-creator-btn" class="close-btn">&times;</button>
      </div>
      <form id="story-form">
        <div class="form-group">
          <label for="story-title">Story Title</label>
          <input type="text" id="story-title" placeholder="e.g. The Obsidian Key" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="story-author">Author / Pen Name</label>
            <input type="text" id="story-author" placeholder="e.g. Anonymous" required />
          </div>

          <div class="form-group">
            <label for="story-category">Genre</label>
            <select id="story-category" required>
              <option value="Horror">Horror</option>
              <option value="Dark Fantasy">Dark Fantasy</option>
              <option value="Thriller">Thriller</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Mystery">Mystery</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="story-image">Cover Photo URL</label>
          <input type="url" id="story-image" placeholder="https://images.unsplash.com/..." required />
          <small>Paste a direct image link (Unsplash, Imgur, etc.)</small>
        </div>

        <div class="form-group">
          <label for="story-content">Story Content</label>
          <textarea id="story-content" rows="9" placeholder="Enter your dark tale..." required></textarea>
        </div>

        <button type="submit" class="btn btn-red btn-block">
          <i class="fa-solid fa-lock"></i> Archive Story
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <i class="fa-solid fa-circle-check" style="color: var(--red-primary)"></i>
    <span id="toast-message">Action completed</span>
  </div>

  <script>
    const STORAGE_KEY = 'black_archive_stories_db';

    // Default starter stories
    const initialStories = [
      {
        id: '1',
        title: 'Whispers in the Obsidian Citadel',
        author: 'Vespera Blood',
        category: 'Dark Fantasy',
        image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000',
        content: 'The ancient red banners hung motionless in the crypts beneath the Obsidian Citadel. Every century, the crimson sigils flared with unholy fire. Princess Lyra held her silver blade as shadows detached themselves from the stonework and began to speak...',
        likes: 89,
        bookmarked: false,
        date: new Date().toISOString()
      },
      {
        id: '2',
        title: 'The Crimson Protocol',
        author: 'Kaelen Voss',
        category: 'Sci-Fi',
        image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000',
        content: 'Deep within Sector 9, the emergency sirens bathed the metallic corridor in pulse-red light. Protocol 7 was initiated. "We cannot let the entity reach the core," Kaelen whispered into his comms, reloading his plasma coil.',
        likes: 64,
        bookmarked: true,
        date: new Date().toISOString()
      }
    ];

    let currentCategory = 'All';
    let showingBookmarksOnly = false;
    let activeStoryId = null;

    // Elements
    const storyGrid = document.getElementById('story-grid');
    const heroBanner = document.getElementById('hero-banner');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-by');
    const creatorModal = document.getElementById('creator-modal');
    const readerModal = document.getElementById('reader-modal');
    const openCreatorBtn = document.getElementById('open-creator-btn');
    const closeCreatorBtn = document.getElementById('close-creator-btn');
    const closeReaderBtn = document.getElementById('close-reader-btn');
    const storyForm = document.getElementById('story-form');
    const categoryBtns = document.querySelectorAll('.category-btn');
    const bookmarksTabBtn = document.getElementById('bookmarks-tab-btn');
    const exportBtn = document.getElementById('export-archive-btn');
    const importBtn = document.getElementById('import-archive-btn');
    const importFileInput = document.getElementById('import-file-input');
    const shareReaderStoryBtn = document.getElementById('share-reader-story-btn');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');

    function loadStories() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : initialStories;
    }

    function saveStories(stories) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stories));
    }

    function showToast(msg) {
      toastMessage.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function computeReadTime(text) {
      const words = text.trim().split(/\s+/).length;
      return `${Math.ceil(words / 200)} min read`;
    }

    function renderHero(story) {
      if (!story) {
        heroBanner.style.display = 'none';
        return;
      }
      heroBanner.style.display = 'flex';
      heroBanner.style.backgroundImage = `url('${story.image}')`;
      heroBanner.innerHTML = `
        <div class="hero-overlay"></div>
        <div class="hero-details">
          <span class="tag">${story.category}</span>
          <h1>${escapeHTML(story.title)}</h1>
          <div class="hero-meta">By ${escapeHTML(story.author)} • ${computeReadTime(story.content)}</div>
          <button class="btn btn-red" onclick="openReader('${story.id}')">
            <i class="fa-solid fa-book-open"></i> Read Featured Archive
          </button>
        </div>
      `;
    }

    function renderStories() {
      let stories = loadStories();

      const query = searchInput.value.toLowerCase().trim();
      if (query) {
        stories = stories.filter(s => 
          s.title.toLowerCase().includes(query) || 
          s.author.toLowerCase().includes(query) ||
          s.category.toLowerCase().includes(query)
        );
      }

      if (currentCategory !== 'All') {
        stories = stories.filter(s => s.category === currentCategory);
      }

      if (showingBookmarksOnly) {
        stories = stories.filter(s => s.bookmarked);
      }

      const sortBy = sortSelect.value;
      if (sortBy === 'popular') {
        stories.sort((a, b) => b.likes - a.likes);
      } else {
        stories.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      storyGrid.innerHTML = '';

      if (stories.length === 0) {
        storyGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 50px;">No dark chronicles found in this vault section.</p>`;
        return;
      }

      stories.forEach(story => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.innerHTML = `
          <div class="card-img-wrapper" onclick="openReader('${story.id}')">
            <img src="${story.image}" alt="${escapeHTML(story.title)}" onerror="this.src='https://via.placeholder.com/400x200/121216/ffffff?text=Black+Archive'"/>
          </div>
          <div class="card-body">
            <span class="tag" style="width: fit-content;">${story.category}</span>
            <h3 class="card-title" onclick="openReader('${story.id}')">${escapeHTML(story.title)}</h3>
            <p class="card-snippet">${escapeHTML(story.content)}</p>
            <div class="card-footer">
              <span>By ${escapeHTML(story.author)}</span>
              <div class="card-actions">
                <i class="fa-solid fa-heart ${story.likes > 0 ? 'active-heart' : ''}" onclick="toggleLike('${story.id}', event)"></i> ${story.likes}
                <i class="fa-${story.bookmarked ? 'solid' : 'regular'} fa-bookmark ${story.bookmarked ? 'active-bookmark' : ''}" onclick="toggleBookmark('${story.id}', event)"></i>
                <i class="fa-solid fa-share-nodes" onclick="shareStory('${story.id}', event)" title="Share Story"></i>
              </div>
            </div>
          </div>
        `;
        storyGrid.appendChild(card);
      });
    }

    function openReader(id) {
      const stories = loadStories();
      const story = stories.find(s => s.id === id);
      if (!story) return;

      activeStoryId = id;
      const article = document.getElementById('reader-article');
      article.innerHTML = `
        <span class="tag">${story.category}</span>
        <h1>${escapeHTML(story.title)}</h1>
        <div class="meta-info">Archived by ${escapeHTML(story.author)} • ${computeReadTime(story.content)}</div>
        <img src="${story.image}" alt="${escapeHTML(story.title)}" />
        <div class="body-text">${escapeHTML(story.content)}</div>
      `;

      readerModal.classList.remove('hidden');
    }

    function toggleLike(id, event) {
      if (event) event.stopPropagation();
      const stories = loadStories();
      const story = stories.find(s => s.id === id);
      if (story) {
        story.likes += 1;
        saveStories(stories);
        renderStories();
      }
    }

    function toggleBookmark(id, event) {
      if (event) event.stopPropagation();
      const stories = loadStories();
      const story = stories.find(s => s.id === id);
      if (story) {
        story.bookmarked = !story.bookmarked;
        saveStories(stories);
        renderStories();
        showToast(story.bookmarked ? "Saved to your bookmarks!" : "Removed from bookmarks.");
      }
    }

    function shareStory(id, event) {
      if (event) event.stopPropagation();
      const stories = loadStories();
      const story = stories.find(s => s.id === id);
      if (!story) return;

      const shareData = {
        title: `Black Archive - ${story.title}`,
        text: `Read "${story.title}" by ${story.author} on Black Archive:\n\n${story.content.substring(0, 150)}...`,
        url: window.location.href.split('?')[0] + `?story=${story.id}`
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
        showToast("Story link & excerpt copied to clipboard!");
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Export stories as JSON file
    exportBtn.onclick = () => {
      const stories = loadStories();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stories, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "black_archive_stories.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Archive downloaded! Share this JSON file with friends.");
    };

    // Import stories from JSON file
    importBtn.onclick = () => importFileInput.click();

    importFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const importedStories = JSON.parse(event.target.result);
          if (Array.isArray(importedStories)) {
            saveStories(importedStories);
            renderHero(importedStories[0]);
            renderStories();
            showToast("Archive updated with imported stories!");
          } else {
            alert("Invalid JSON format.");
          }
        } catch (err) {
          alert("Error reading file: " + err.message);
        }
      };
      reader.readAsText(file);
    };

    // Check URL parameters for direct shared story
    function checkURLForSharedStory() {
      const urlParams = new URLSearchParams(window.location.search);
      const storyId = urlParams.get('story');
      if (storyId) {
        openReader(storyId);
      }
    }

    // Event Handlers
    openCreatorBtn.onclick = () => creatorModal.classList.remove('hidden');
    closeCreatorBtn.onclick = () => creatorModal.classList.add('hidden');
    closeReaderBtn.onclick = () => readerModal.classList.add('hidden');
    shareReaderStoryBtn.onclick = () => shareStory(activeStoryId);

    searchInput.oninput = renderStories;
    sortSelect.onchange = renderStories;

    categoryBtns.forEach(btn => {
      btn.onclick = () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        showingBookmarksOnly = false;
        bookmarksTabBtn.classList.remove('active');
        renderStories();
      };
    });

    bookmarksTabBtn.onclick = () => {
      showingBookmarksOnly = !showingBookmarksOnly;
      bookmarksTabBtn.classList.toggle('active', showingBookmarksOnly);
      renderStories();
    };

    storyForm.onsubmit = (e) => {
      e.preventDefault();
      
      const newStory = {
        id: Date.now().toString(),
        title: document.getElementById('story-title').value,
        author: document.getElementById('story-author').value,
        category: document.getElementById('story-category').value,
        image: document.getElementById('story-image').value,
        content: document.getElementById('story-content').value,
        likes: 0,
        bookmarked: false,
        date: new Date().toISOString()
      };

      const stories = loadStories();
      stories.unshift(newStory);
      saveStories(stories);

      storyForm.reset();
      creatorModal.classList.add('hidden');
      renderHero(newStory);
      renderStories();
      showToast("New tale archived successfully!");
    };

    // Load initial data
    const storiesData = loadStories();
    renderHero(storiesData[0]);
    renderStories();
    checkURLForSharedStory();
  </script>
</body>
</html>
